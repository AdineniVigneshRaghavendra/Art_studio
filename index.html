<!DOCTYPE html>
<html lang="en">
    <head><meta charset="UTF-8">
    <meta name="viewport"
content="width=device-width,
initial-scale=1.0">
  <title>Generative Art Studio</title>

  <link rel="stylesheet" href="style.css">
</head>

    <body>
        <canvas id="artCanvas"></canvas>

        <div class="control-panel">
            <h1>My Art studio 😎</h1>
            <p> Particle Simulation art 🎨</p>

            <button id="pauseButton">Pause</button>

            <button id="resumeButton">Resume</button>

            <label for="particleSlider">Particles</label>
            <input
            type="range"
            id="particleSlider"
            min="50"
            max="400"
            value="200">

            <p id="particleValue">200</p>
            
            <label for="speedSlider">Speed</label>
            <input
                type="range"
                id="speedSlider"
                min="1"
                max="10"
                value="2">
            <p id="speedValue">2</p>

            <label for="patternMode">Pattern</label>

            <select id="patternMode">
                <option value="normal">✨ Particle Network</option>
                <option value="galaxy">🌌 Galaxy</option>
                <option value="waves">🏄‍♀️ Waves</option>
                <option value="spiral">😵‍💫 Spiral</option>
                <option value="fireflies">🎆 Fireflies</option>
            </select>

            <button id="randomButton">🎲Randomize</button>
            <button id="saveButton">Save Artwork 😆</button>
            <button id="resetButton">🔁 Reset </button>
        </div>

        <script src="script.js"></script>

    </body>
  
</html>
